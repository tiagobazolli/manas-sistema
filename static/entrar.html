form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.logo{width:180px;margin:0 auto 6px}
p{margin:0;color:var(--muted);text-align:center}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:14px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.erro{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;text-align:left}
</style>
</head>
<body>
<form method="post" action="/entrar">
  <div class="logo" role="img" aria-label="Manas moda sustentável"></div>
  <p>Caixa e estoque da loja</p>
  <div class="erro" id="erro" hidden></div>
  <label for="senha">Senha da loja
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
  </label>
  <button type="submit">Entrar</button>
</form>
<script>
const e=new URLSearchParams(location.search).get("erro");const box=document.getElementById("erro");
if(e==="senha"){box.textContent="Senha incorreta. Confira e tente de novo.";box.hidden=false}
if(e==="config"){box.textContent="A senha da loja ainda não foi configurada no servidor (variável MANAS_SENHA).";box.hidden=false}
</script>
</body>
</html>
