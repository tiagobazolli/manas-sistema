// Widget "Contas a vencer" do dashboard — pendentes nos próximos 15 dias
// (e atrasadas, destacadas em vermelho). "já paguei" é o fallback manual
// pra quando a baixa automática não casou sozinha com o extrato.
function WidgetContasAVencer({ usuarioId }) {
  const [itens, setItens] = useState(null);
  const [pagando, setPagando] = useState(null);

  function carregar() {
    fetch(`${API_URL}/api/contas-a-vencer/${usuarioId}?dias=15`)
      .then((r) => r.json())
      .then((lista) => setItens(Array.isArray(lista) ? lista : []))
      .catch(() => setItens([]));
  }
  useEffect(carregar, [usuarioId]);

  async function jaPaguei(baixaId) {
    setPagando(baixaId);
    try {
      await fetch(`${API_URL}/api/contas-fixas/${usuarioId}/baixar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ baixa_id: baixaId }),
      });
      carregar();
    } catch (e) {
      alert("Não consegui confirmar — confere sua internet e tenta de novo.");
    } finally {
      setPagando(null);
    }
  }

  function diasAte(dataISO) {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    return Math.round((new Date(dataISO + "T00:00:00") - hoje) / 86400000);
  }
  function rotuloData(dataISO, atrasada) {
    const dias = diasAte(dataISO);
    if (atrasada) return `venceu em ${new Date(dataISO + "T00:00:00").toLocaleDateString("pt-BR")}`;
    if (dias === 0) return "vence hoje";
    if (dias === 1) return "vence amanhã";
    return `vence em ${dias} dias`;
  }

  if (!itens) return null;

  return (
    <div style={CARTAO}>
      <div style={{ ...ROTULO, marginBottom: 4 }}>Contas a vencer</div>
      {itens.length === 0 && (
        <div style={{ fontSize: 12.5, color: "var(--muted)", padding: "6px 0" }}>Nenhuma conta fixa vencendo nos próximos 15 dias.</div>
      )}
      {itens.map((it, i) => {
        const urgente = it.atrasada || diasAte(it.data_vencimento) <= 2;
        return (
          <div key={it.baixa_id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderTop: i ? "1px solid var(--line)" : "none" }}>
            <span style={{ width: 34, height: 34, borderRadius: 10, flex: "none", display: "grid", placeItems: "center", fontWeight: 800, fontSize: 12.5,
              background: urgente ? "var(--red)" : "var(--track)", color: urgente ? "#fff" : "var(--ink)" }}>
              {it.data_vencimento.slice(8, 10)}
            </span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700 }}>{it.eh_fatura_cartao && <Icone nome="cartao" tamanho={15} style={{ marginRight: 5, marginTop: -2 }} />}{it.nome}</div>
              <div style={{ fontSize: 11.5, color: it.atrasada ? "var(--red)" : "var(--muted)", fontWeight: it.atrasada ? 600 : 400 }}>
                {rotuloData(it.data_vencimento, it.atrasada)}{it.valor_esperado ? ` · ~${fmt2(it.valor_esperado)}` : ""}
              </div>
            </div>
            <button
              onClick={() => jaPaguei(it.baixa_id)}
              disabled={pagando === it.baixa_id}
              style={{ fontSize: 11.5, background: "var(--bg)", color: "var(--ink)", border: "1px solid var(--line)", padding: "6px 10px", cursor: "pointer", whiteSpace: "nowrap" }}
            >
              {pagando === it.baixa_id ? "..." : "já paguei"}
            </button>
          </div>
        );
      })}
    </div>
  );
}

// Página 1 — Início: saldo, rosca de categorias, ritmo do mês, pontos de
// atenção, categorias x média e contas a vencer. O alternador "Este mês /
// Desde o início" continua: no "desde o início" saem o ritmo e a média,
// que só fazem sentido mês a mês.
function PaginaDashboard({ usuarioId, mesAtual, periodo, historico, painel, carregando, aoAbrirDetalhe, visao, setVisao, aoEscolherMes }) {
  const [gerenciandoSaldo, setGerenciandoSaldo] = useState(false);
  const [versaoSaldo, setVersaoSaldo] = useState(0);
  const temMes = !!mesAtual;
  const ehMes = visao === "mes" && temMes;
  const dadosView = ehMes ? mesAtual : periodo;
  const painelDoMes = ehMes && painel && painel.mes === mesAtual.mes ? painel : null;
  const mesDetalhe = ehMes ? mesAtual.mes : null;
  const abrir = (tipo) => (cat) => aoAbrirDetalhe({ categoria: cat, mes: mesDetalhe, tipo });

  // categorias com a média (quando o painel do mês veio) ou só o valor
  const categorias = painelDoMes
    ? painelDoMes.categorias
    : (dadosView ? dadosView.categorias.map((c) => ({ ...c, media: null, dif: null })) : []);
  const vazio = !dadosView || (dadosView.receita_total === 0 && dadosView.despesa_total === 0 && categorias.length === 0);

  return (
    <div>
      <div style={{ display: "flex", background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 999, padding: 3, marginBottom: 14, maxWidth: 320 }}>
        {[["mes", "Este mês", temMes], ["periodo", "Desde o início", true]].map(([v, rotulo, pode]) => (
          <button key={v} onClick={() => setVisao(v)} disabled={!pode}
            style={{ flex: 1, padding: "7px 0", fontSize: 12.5, fontWeight: 700, border: "none", borderRadius: 999, cursor: pode ? "pointer" : "not-allowed", fontFamily: SANS, background: (v === "mes") === ehMes ? "var(--primary)" : "transparent", color: (v === "mes") === ehMes ? "#fff" : "var(--muted)" }}>
            {rotulo}
          </button>
        ))}
      </div>

      <div className={ehMes ? "dash" : "dash periodo"}>
        <div className="d-hero" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <HeroSaldo usuarioId={usuarioId} dadosView={dadosView} rotuloPeriodo={ehMes ? "no mês" : "no período"} versaoSaldo={versaoSaldo}
            gerenciando={gerenciandoSaldo} aoGerenciar={() => setGerenciandoSaldo((g) => !g)} />
          {gerenciandoSaldo && <WidgetSaldoDisponivel usuarioId={usuarioId} aoMudar={() => setVersaoSaldo((v) => v + 1)} />}
        </div>

        {vazio && !carregando && (
          <div className="d-alertas" style={{ ...CARTAO, fontSize: 14, color: "var(--muted)" }}>
            Nenhum extrato processado ainda. Toque em "+" (ou vá em Lançamentos) e envie um arquivo pra começar.
          </div>
        )}

        {!vazio && ehMes && <PontosDeAtencao painel={painelDoMes} aoClicar={abrir("D")} />}

        {!vazio && !ehMes && historico && historico.length > 1 && (
          <CartaoMesAMes historico={historico} mesCorrente={new Date().toISOString().slice(0, 7)} aoEscolherMes={aoEscolherMes} />
        )}

        {!vazio && categorias.length > 0 && (
          <CartaoRosca categorias={categorias} total={dadosView.despesa_total} rotulo={ehMes ? "gasto no mês" : "gasto no período"} aoClicar={abrir("D")} />
        )}

        {!vazio && categorias.length > 0 && (
          <CategoriasVsMedia categorias={categorias} comMedia={!!painelDoMes && painelDoMes.meses_historico > 0} aoClicar={abrir("D")} />
        )}

        {!vazio && painelDoMes && <CartaoRitmo painel={painelDoMes} />}

        <div className="d-lado">
          <WidgetContasAVencer usuarioId={usuarioId} />
          {!vazio && dadosView.categorias_receita && dadosView.categorias_receita.length > 0 && (
            <div style={CARTAO}>
              <div style={{ ...ROTULO, marginBottom: 10 }}>Entradas {ehMes ? "do mês" : "do período"}</div>
              {dadosView.categorias_receita.map((c) => (
                <button key={c.nome} onClick={() => abrir("C")(c.nome)}
                  style={{ display: "block", width: "100%", padding: "6px 0", background: "none", border: "none", color: "var(--ink)", fontFamily: SANS, textAlign: "left", cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 13 }}>
                    <span style={{ fontWeight: 600, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.nome}</span>
                    <b style={{ whiteSpace: "nowrap" }}>{fmt(c.valor)}</b>
                  </div>
                  <div style={{ height: 6, background: "var(--track)", borderRadius: 6, marginTop: 5 }}>
                    <div style={{ height: "100%", width: `${(c.valor / Math.max(...dadosView.categorias_receita.map((r) => r.valor), 1)) * 100}%`, background: "var(--green)", borderRadius: 6 }} />
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// Página 2 — Lançamentos: onde se trabalha de verdade — subir extrato,
// registrar gasto em dinheiro, responder pendências e corrigir/detalhar
// categoria por categoria do mês selecionado.
// Cadastro e gerenciamento das contas fixas — cadastra uma vez (nome,
// categoria/subgrupo, dia do vencimento, valor esperado opcional) e a
// baixa automática cuida do resto quando o pagamento aparecer no extrato.
function SecaoContasFixas({ usuarioId, categorias }) {
  const [contas, setContas] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [editandoId, setEditandoId] = useState(null); // null = cadastrando nova; id = editando essa
  const [nome, setNome] = useState("");
  const [categoria, setCategoria] = useState("");
  const [subgrupos, setSubgrupos] = useState([]);
  const [subcategoria, setSubcategoria] = useState("");
  const [diaVencimento, setDiaVencimento] = useState("");
  const [valorEsperado, setValorEsperado] = useState("");
  const [ehFaturaCartao, setEhFaturaCartao] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [confirmandoExclusaoId, setConfirmandoExclusaoId] = useState(null);
  const [excluindo, setExcluindo] = useState(false);

  function carregarContas() {
    fetch(`${API_URL}/api/contas-fixas/${usuarioId}`)
      .then((r) => r.json())
      .then((lista) => setContas(Array.isArray(lista) ? lista : []))
      .catch(() => setContas([]));
  }
  useEffect(carregarContas, [usuarioId]);

  useEffect(() => {
    if (!categoria) { setSubgrupos([]); return; }
    fetch(`${API_URL}/api/subcategorias/${usuarioId}?categoria=${encodeURIComponent(categoria)}`)
      .then((r) => r.json())
      .then((lista) => setSubgrupos(Array.isArray(lista) ? lista : []))
      .catch(() => setSubgrupos([]));
  }, [categoria]);

  function limparFormulario() {
    setNome(""); setCategoria(""); setSubcategoria(""); setDiaVencimento(""); setValorEsperado(""); setEhFaturaCartao(false);
    setEditandoId(null);
    setMostrarForm(false);
  }

  function iniciarEdicao(conta) {
    setEditandoId(conta.id);
    setNome(conta.nome);
    setEhFaturaCartao(!!conta.eh_fatura_cartao);
    setCategoria(conta.eh_fatura_cartao ? "" : (conta.categoria || ""));
    setSubcategoria(conta.eh_fatura_cartao ? "" : (conta.subcategoria || ""));
    setDiaVencimento(String(conta.dia_vencimento));
    setValorEsperado(conta.valor_esperado != null ? String(conta.valor_esperado) : "");
    setConfirmandoExclusaoId(null);
    setMostrarForm(true);
  }

  async function salvar() {
    if (!nome.trim() || !diaVencimento || (!ehFaturaCartao && !categoria)) return;
    setSalvando(true);
    try {
      const url = editandoId ? `${API_URL}/api/contas-fixas/${usuarioId}/${editandoId}` : `${API_URL}/api/contas-fixas/${usuarioId}`;
      const r = await fetch(url, {
        method: editandoId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome, categoria, subcategoria: subcategoria || null,
          dia_vencimento: parseInt(diaVencimento, 10),
          valor_esperado: valorEsperado ? parseFloat(valorEsperado) : null,
          eh_fatura_cartao: ehFaturaCartao,
        }),
      });
      const dados = await r.json();
      if (dados.erro) { alert(dados.erro); return; }
      limparFormulario();
      carregarContas();
    } catch (e) {
      alert("Não consegui salvar — confere sua internet e tenta de novo.");
    } finally {
      setSalvando(false);
    }
  }

  async function alternarAtiva(conta) {
    try {
      await fetch(`${API_URL}/api/contas-fixas/${usuarioId}/${conta.id}/ativa`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ativo: !conta.ativo }),
      });
      carregarContas();
    } catch (e) {
      alert("Não consegui atualizar — confere sua internet e tenta de novo.");
    }
  }

  async function excluirConta(contaId) {
    setExcluindo(true);
    try {
      const r = await fetch(`${API_URL}/api/contas-fixas/${usuarioId}/${contaId}`, { method: "DELETE" });
      const dados = await r.json();
      if (dados.erro) { alert(dados.erro); return; }
      setConfirmandoExclusaoId(null);
      carregarContas();
    } catch (e) {
      alert("Não consegui excluir — confere sua internet e tenta de novo.");
    } finally {
      setExcluindo(false);
    }
  }

  return (
    <div style={{ marginTop: 32 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <TituloSecao sub="cadastre uma vez e a baixa acontece sozinha quando o pagamento aparecer no extrato">
          Contas fixas
        </TituloSecao>
        <button
          onClick={() => (mostrarForm ? limparFormulario() : setMostrarForm(true))}
          style={{ fontSize: 12.5, fontWeight: 600, background: mostrarForm ? "var(--bg)" : "var(--primary)", color: mostrarForm ? "var(--muted)" : "#fff", border: mostrarForm ? "1px solid var(--line)" : "none", padding: "7px 12px", cursor: "pointer", whiteSpace: "nowrap" }}
        >
          {mostrarForm ? "cancelar" : "+ nova conta"}
        </button>
      </div>

      {mostrarForm && (
        <div style={{ background: "var(--paper)", border: "1px solid var(--line)", borderRadius: "var(--radius)", boxShadow: "var(--shadow)", padding: 16, marginBottom: 14, display: "flex", flexDirection: "column", gap: 8 }}>
          {editandoId && <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--primary)", textTransform: "uppercase", letterSpacing: 0.4 }}>editando conta</div>}
          <input
            value={nome}
            onChange={(e) => setNome(e.target.value)}
            placeholder="Nome (ex: Água, Internet, Academia)"
            style={{ fontSize: 13, padding: "8px 10px", border: "1px solid var(--line)", background: "var(--bg)", color: "var(--ink)" }}
          />
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: "var(--ink)", cursor: "pointer", padding: "2px 2px" }}>
            <input
              type="checkbox"
              checked={ehFaturaCartao}
              onChange={(e) => { setEhFaturaCartao(e.target.checked); if (e.target.checked) { setCategoria(""); setSubcategoria(""); } }}
              style={{ width: 15, height: 15 }}
            />
            <Icone nome="cartao" tamanho={16} /> é a fatura do cartão de crédito
          </label>
          {ehFaturaCartao ? (
            <div style={{ fontSize: 11.5, color: "var(--muted)" }}>
              quando o pagamento em bloco da fatura aparecer no extrato, ele já entra contado normalmente — e se você também enviar a fatura detalhada daquele mês, o app troca sozinho pro detalhamento item a item (sem contar o gasto duas vezes)
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <select
                value={categoria}
                onChange={(e) => { setCategoria(e.target.value); setSubcategoria(""); }}
                style={{ flex: 1, minWidth: 140, fontSize: 13, padding: "8px 10px", border: "1px solid var(--line)", background: "var(--bg)", color: "var(--ink)" }}
              >
                <option value="">categoria...</option>
                {(categorias.despesa || []).map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <select
                value={subcategoria}
                onChange={(e) => setSubcategoria(e.target.value)}
                disabled={!categoria}
                style={{ flex: 1, minWidth: 140, fontSize: 13, padding: "8px 10px", border: "1px solid var(--line)", background: "var(--bg)", color: "var(--ink)" }}
              >
                <option value="">sem subgrupo</option>
                {subgrupos.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              type="number" min="1" max="31" value={diaVencimento}
              onChange={(e) => setDiaVencimento(e.target.value)}
              placeholder="dia do vencimento (1-31)"
              style={{ flex: 1, minWidth: 140, fontSize: 13, padding: "8px 10px", border: "1px solid var(--line)", background: "var(--bg)", color: "var(--ink)" }}
            />
            <input
              type="number" step="0.01" value={valorEsperado}
              onChange={(e) => setValorEsperado(e.target.value)}
              placeholder="valor esperado (opcional)"
              style={{ flex: 1, minWidth: 140, fontSize: 13, padding: "8px 10px", border: "1px solid var(--line)", background: "var(--bg)", color: "var(--ink)" }}
            />
          </div>
          <div style={{ fontSize: 11.5, color: "var(--muted)" }}>
            deixe o valor em branco se ele varia todo mês (ex: água, luz) — sem valor, a baixa casa só pela categoria/subgrupo do mês
          </div>
          <button
            onClick={salvar}
            disabled={salvando || !nome.trim() || !diaVencimento || (!ehFaturaCartao && !categoria)}
            style={{ fontSize: 13, fontWeight: 600, background: "var(--primary)", color: "#fff", border: "none", padding: "9px 14px", cursor: "pointer" }}
          >
            {salvando ? "..." : editandoId ? "salvar alterações" : "cadastrar conta"}
          </button>
        </div>
      )}

      {contas === null && <div style={{ fontSize: 13, color: "var(--muted)" }}>carregando...</div>}
      {contas && contas.length === 0 && !mostrarForm && (
        <div style={{ fontFamily: SANS, fontSize: 13, color: "var(--muted)" }}>nenhuma conta fixa cadastrada ainda</div>
      )}
      {contas && contas.map((c) => (
        <div
          key={c.id}
          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, padding: "10px 14px", borderRadius: "var(--radius-sm)", background: "var(--paper)", border: "1px solid var(--line)", marginBottom: 6, opacity: c.ativo ? 1 : 0.55 }}
        >
          {confirmandoExclusaoId === c.id ? (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", width: "100%" }}>
              <div style={{ flex: 1, minWidth: 160, fontSize: 12, color: "var(--ink)" }}>
                excluir "{c.nome}"? os lançamentos já feitos continuam intactos, só o cadastro e as baixas pendentes somem.
              </div>
              <button onClick={() => excluirConta(c.id)} disabled={excluindo} style={{ fontSize: 11.5, background: "var(--red)", color: "#fff", border: "none", padding: "6px 10px", cursor: "pointer" }}>
                {excluindo ? "..." : "excluir"}
              </button>
              <button onClick={() => setConfirmandoExclusaoId(null)} style={{ fontSize: 11.5, background: "var(--bg)", color: "var(--muted)", border: "1px solid var(--line)", padding: "6px 10px", cursor: "pointer" }}>
                cancelar
              </button>
            </div>
          ) : (
            <>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{c.nome}</div>
                <div style={{ fontSize: 11.5, color: "var(--muted)" }}>
                  {c.eh_fatura_cartao ? <><Icone nome="cartao" tamanho={14} style={{ marginTop: -2 }} /> fatura do cartão</> : `${c.categoria}${c.subcategoria ? ` · ${c.subcategoria}` : ""}`} · todo dia {c.dia_vencimento}
                  {c.valor_esperado ? ` · ~${fmt2(c.valor_esperado)}` : ""}
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <button onClick={() => iniciarEdicao(c)} title="editar" style={{ background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "var(--muted)", padding: 4 }}>
                  <Icone nome="editar" tamanho={16} />
                </button>
                <button onClick={() => setConfirmandoExclusaoId(c.id)} title="excluir" style={{ background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "var(--muted)", padding: 4 }}>
                  <Icone nome="lixeira" tamanho={16} />
                </button>
                <button
                  onClick={() => alternarAtiva(c)}
                  style={{ fontSize: 11.5, background: "var(--bg)", color: "var(--muted)", border: "1px solid var(--line)", padding: "5px 10px", cursor: "pointer", whiteSpace: "nowrap" }}
                >
                  {c.ativo ? "pausar" : "reativar"}
                </button>
              </div>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

function PaginaLancamentos({ usuarioId, mesAtual, pendentes, categorias, aoProcessar, aoResponderPergunta, aoCriarCategoria, aoAbrirDetalhe }) {
  const temCategorias = mesAtual && (mesAtual.categorias.length > 0 || (mesAtual.categorias_receita && mesAtual.categorias_receita.length > 0));
  return (
    <div>
      <AreaUpload usuarioId={usuarioId} aoProcessar={aoProcessar} />
      <AreaGastoDinheiro usuarioId={usuarioId} aoProcessar={aoProcessar} />

      <TituloSecao sub={pendentes.length > 0 ? "responda direto aqui — fica guardado pra da próxima vez" : "nada pendente no momento"}>
        Preciso confirmar com você
      </TituloSecao>
      {pendentes.map((p) => (
        <CartaoPergunta key={p.id} pergunta={p} usuarioId={usuarioId} categorias={categorias} aoResponder={aoResponderPergunta} aoCriarCategoria={aoCriarCategoria} />
      ))}

      <SecaoContasFixas usuarioId={usuarioId} categorias={categorias} />

      {temCategorias && (
        <div style={{ marginTop: 32 }}>
          <TituloSecao sub="toque numa categoria pra ver, corrigir ou excluir os lançamentos do mês">
            Detalhamento do mês
          </TituloSecao>
          {mesAtual.categorias.length > 0 && (
            <>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 10 }}>Despesas</div>
              <GraficoCategorias dados={mesAtual.categorias} cor="var(--primary)"
                onClicarCategoria={(cat) => aoAbrirDetalhe({ categoria: cat, mes: mesAtual.mes, tipo: "D" })} />
            </>
          )}
          {mesAtual.categorias_receita && mesAtual.categorias_receita.length > 0 && (
            <>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 10, marginTop: 28 }}>Receitas</div>
              <GraficoCategorias dados={mesAtual.categorias_receita} cor="var(--green)"
                onClicarCategoria={(cat) => aoAbrirDetalhe({ categoria: cat, mes: mesAtual.mes, tipo: "C" })} />
            </>
          )}
        </div>
      )}
    </div>
  );
}

function PainelAssessorIA() {
  const params = new URLSearchParams(window.location.search);
  const usuarioId = params.get("usuario");

  const [dados, setDados] = useState(RESUMO_VAZIO);
  const [carregando, setCarregando] = useState(true);
  const [meses, setMeses] = useState([]);
  const [mesEscolhido, setMesEscolhido] = useState(null); // null = mais recente
  const [detalheAberto, setDetalheAberto] = useState(null); // { categoria, mes } | null
  const [categorias, setCategorias] = useState({ despesa: CATEGORIAS_DESPESA_PADRAO, receita: CATEGORIAS_RECEITA_PADRAO });
  const [pagina, setPagina] = useState("dashboard"); // "dashboard" | "lancamentos" — as duas páginas do app
  const [painel, setPainel] = useState(null); // gráficos e pontos de atenção do mês (/api/painel)
  const [visao, setVisao] = useState("mes"); // "mes" | "periodo" — alternador do Início

  async function carregarCategorias() {
    try {
      const r = await fetch(`${API_URL}/api/categorias/${usuarioId}`);
      setCategorias(await r.json());
    } catch (e) { /* silencioso — cai no padrão */ }
  }

  async function carregarResumo(mes) {
    try {
      const qs = mes ? `?mes=${mes}` : "";
      const r = await fetch(`${API_URL}/api/resumo/${usuarioId}${qs}`);
      const d = await r.json();
      setDados(d);
      if (d.mes_atual && !mesEscolhido) setMesEscolhido(d.mes_atual.mes);
      if (d.mes_atual) {
        fetch(`${API_URL}/api/painel/${usuarioId}?mes=${d.mes_atual.mes}`)
          .then((r) => r.json())
          .then(setPainel)
          .catch(() => setPainel(null)); // sem o painel, o Início só não mostra ritmo/média/alertas
      } else {
        setPainel(null);
      }
    } catch (e) {
      setDados(RESUMO_VAZIO);
    } finally {
      setCarregando(false);
    }
  }

  async function carregarMeses() {
    try {
      const r = await fetch(`${API_URL}/api/meses/${usuarioId}`);
      setMeses(await r.json());
    } catch (e) { /* silencioso — o seletor só não aparece */ }
  }

  useEffect(() => {
    if (usuarioId) { carregarResumo(); carregarMeses(); carregarCategorias(); }
    else setCarregando(false);
  }, [usuarioId]);

  function trocarMes(novoMes) {
    setMesEscolhido(novoMes);
    setCarregando(true);
    carregarResumo(novoMes);
  }

  function aoResponderPergunta(perguntaId) {
    setDados((d) => ({ ...d, pendencias: d.pendencias.filter((p) => p.id !== perguntaId) }));
    setTimeout(() => carregarResumo(mesEscolhido), 300);
  }

  if (!usuarioId) return <TelaNovoParticipante />;

  const mesAtual = dados.mes_atual;
  const pendentes = dados.pendencias || [];
  const aoProcessar = () => { carregarResumo(mesEscolhido); carregarMeses(); };

  return (
    <div style={{ minHeight: "100vh" }}>
      <Sidebar ativa={pagina} aoTrocar={setPagina} />

      <div className="app-main">

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.5 }}>
              {pagina === "dashboard" ? (dados.usuario_nome ? `Oi, ${dados.usuario_nome.split(" ")[0]}!` : "Oi!") : "Lançamentos"}
            </div>
            <div style={{ fontSize: 13, color: "var(--muted)" }}>
              {carregando ? "carregando..." : pagina !== "dashboard" ? "envie extratos, registre gastos e confirme o que ficou pendente"
                : visao === "periodo" || !mesAtual ? "Seu dinheiro desde o primeiro extrato."
                : painel && painel.mes === mesAtual.mes && painel.mes_corrente ? `Seu dinheiro em ${nomeMesLongo(mesAtual.mes)}, até o dia ${painel.dia_referencia}.`
                : `Seu dinheiro em ${nomeMesLongo(mesAtual.mes)}.`}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <BotaoTema />
            {pagina === "dashboard" && visao === "mes" && mesAtual && meses.length > 1 && (
              <select
                value={mesEscolhido || mesAtual.mes}
                onChange={(e) => trocarMes(e.target.value)}
                aria-label="Escolher mês"
                style={{ fontFamily: SANS, fontSize: 12.5, fontWeight: 700, color: "var(--ink)", background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 999, padding: "7px 12px", textTransform: "capitalize" }}
              >
                {meses.map((m) => <option key={m} value={m}>{nomeMes(m)}</option>)}
              </select>
            )}
            {pagina === "dashboard" && (
              <button onClick={() => setPagina("lancamentos")} className="so-desktop"
                style={{ fontSize: 12.5, fontWeight: 700, background: "var(--primary)", color: "#fff", border: "none", borderRadius: 999, padding: "8px 14px", cursor: "pointer" }}>
                + Enviar extrato
              </button>
            )}
          </div>
        </div>

        {pagina === "dashboard" ? (
          <PaginaDashboard
            usuarioId={usuarioId} mesAtual={mesAtual} periodo={dados.periodo_completo} historico={dados.historico_mensal} painel={painel}
            carregando={carregando} aoAbrirDetalhe={setDetalheAberto} visao={visao} setVisao={setVisao}
            aoEscolherMes={(m) => { setVisao("mes"); trocarMes(m); }}
          />
        ) : (
          <div className="pagina-estreita">
            <PaginaLancamentos
              usuarioId={usuarioId} mesAtual={mesAtual} pendentes={pendentes} categorias={categorias}
              aoProcessar={aoProcessar} aoResponderPergunta={aoResponderPergunta}
              aoCriarCategoria={carregarCategorias} aoAbrirDetalhe={setDetalheAberto}
            />
          </div>
        )}

        {detalheAberto && (
          <PainelDetalheCategoria usuarioId={usuarioId} categoria={detalheAberto.categoria} mes={detalheAberto.mes} tipo={detalheAberto.tipo} categorias={categorias}
            aoFechar={() => setDetalheAberto(null)} aoCorrigir={() => carregarResumo(mesEscolhido)} />
        )}

      </div>

      <BottomNav ativa={pagina} aoTrocar={setPagina} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PainelAssessorIA />);
</script>
</body>
</html>
